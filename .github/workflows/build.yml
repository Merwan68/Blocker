name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build web assets
      run: |
        npm install --legacy-peer-deps
        npm run build || true

    - name: Configure Web Assets and Sync Capacitor
      run: |
        # Point Capacitor to the Vite 'dist' output directory
        if [ -f "capacitor.config.json" ]; then
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.webDir = "dist";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
        fi
        
        # Ensure fallback www directory exists with files copied from dist
        mkdir -p www
        if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
          cp -r dist/* www/
        elif [ -f "index.html" ]; then
          cp index.html www/
        fi

        npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
