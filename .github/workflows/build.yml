name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and Capacitor CLI
      run: |
        npm install --legacy-peer-deps
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps || true

    - name: Configure Capacitor and Add Android Platform
      run: |
        node -e '
          const fs = require("fs");
          let config = {};
          if (fs.existsSync("capacitor.config.json")) {
            try {
              config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            } catch (e) {}
          }
          config.appId = config.appId || "com.aegisbet.app";
          config.appName = config.appName || "Blocker";
          config.webDir = "dist";
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
        '

        rm -rf android
        npx cap add android

    - name: Build Web Assets and Sync Capacitor
      run: |
        npm run build
        npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk