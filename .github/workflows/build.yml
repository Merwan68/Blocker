name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build web assets
      run: |
        npm install
        npm run build || true

    - name: Check directory contents
      run: ls -la android/

    - name: Build debug app using alternative wrapper if available
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
        else
          echo "Gradle wrapper missing from repository. Please ensure gradle files are committed."
          exit 1
        fi
