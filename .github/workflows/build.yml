name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and build web assets
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Set up Capacitor Android Platform and Patch Kotlin
      run: |
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps || true
        
        # Ensure config points to dist
        node -e '
          const fs = require("fs");
          let config = {};
          if (fs.existsSync("capacitor.config.json")) {
            try { config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8")); } catch (e) {}
          }
          config.appId = config.appId || "com.aegisbet.app";
          config.appName = config.appName || "Blocker";
          config.webDir = "dist";
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
        '

        # Force clean generation
        rm -rf android
        npx cap add android
        npx cap sync android

        # Inject Kotlin resolution strategy to eliminate version clashes
        if [ -f "android/build.gradle" ]; then
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy {" >> android/build.gradle
          echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
