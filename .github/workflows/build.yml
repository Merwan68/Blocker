name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build web assets
      run: |
        npm install --legacy-peer-deps
        npm run build || true

    - name: Install system Gradle and Build APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        cd android
        
        # Ensure base build and settings files exist for gradle resolution
        if [ ! -f "build.gradle" ]; then
          echo "allprojects { repositories { google(); mavenCentral() } }" > build.gradle
        fi
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
