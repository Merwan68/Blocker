name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build web assets
      run: |
        npm install --legacy-peer-deps
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps || true
        npm run build || true

    - name: Point Capacitor to Vite Output and Add Android Platform
      run: |
        # Ensure capacitor.config points webDir to 'dist'
        if [ -f "capacitor.config.json" ]; then
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.webDir = "dist";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
        fi

        # Remove incomplete android folder and let Capacitor generate a fresh, complete native project with gradlew
        rm -rf android
        npx cap add android
        npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
