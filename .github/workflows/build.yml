name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build web assets
      run: |
        npm install --legacy-peer-deps
        npm run build || true

    - name: Download Gradle Wrapper Files
      run: |
        cd android
        mkdir -p gradle/wrapper
        curl -sL https://raw.githubusercontent.com/react-native-community/template/main/android/gradlew -o gradlew
        curl -sL https://raw.githubusercontent.com/react-native-community/template/main/android/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
        curl -sL https://raw.githubusercontent.com/react-native-community/template/main/android/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
